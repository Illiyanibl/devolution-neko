# §AI-control: подгонка окна общего браузера под размер X-экрана :99
# (см. window-fit.sh) — чтобы окно следовало за динамическим ресайзом
# разрешения, который делает клиент при переходе на Viewer.
[program:window-fit]
environment=HOME="/home/%(ENV_USER)s",USER="%(ENV_USER)s",DISPLAY="%(ENV_DISPLAY)s"
command=/usr/local/bin/window-fit.sh
autorestart=true
priority=950
user=%(ENV_USER)s
stdout_logfile=/var/log/neko/window-fit.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
redirect_stderr=true

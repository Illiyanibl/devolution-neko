# §AI-control: keeper держит один общий браузер открытым всегда (см.
# browser-keeper.cjs). Персистентная MCP-сессия → браузер виден во Viewer даже
# без активного агента; агент делит тот же браузер (--shared-browser-context).
[program:browser-keeper]
environment=HOME="/home/%(ENV_USER)s",USER="%(ENV_USER)s",PW_MCP_PORT="9250",NODE_PATH="/usr/lib/node_modules"
command=/usr/bin/node /usr/local/bin/browser-keeper.cjs
autorestart=true
startretries=1000000
priority=900
user=%(ENV_USER)s
stdout_logfile=/var/log/neko/browser-keeper.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
redirect_stderr=true

# §AI-control: control-plane @playwright/mcp — общий браузер + MCP-инструменты.
# Слушает 0.0.0.0:9250 ТОЛЬКО во внутренней docker-сети (порт наружу НЕ
# публикуется в docker run). Агент ходит на http://hedgehog-neko:9250/mcp.
[program:browser-mcp]
environment=HOME="/home/%(ENV_USER)s",USER="%(ENV_USER)s",DISPLAY="%(ENV_DISPLAY)s",PLAYWRIGHT_BROWSERS_PATH="/opt/pw-browsers",PW_MCP_PORT="9250"
command=/usr/local/bin/start-browser-mcp.sh
autorestart=true
priority=800
user=%(ENV_USER)s
stdout_logfile=/var/log/neko/browser-mcp.log
stdout_logfile_maxbytes=100MB
stdout_logfile_backups=5
redirect_stderr=true

# §AI-control: сторож браузера (см. browser-watchdog.sh). Нет главного процесса
# браузера дольше грейса → чистый рестарт контейнера. user=root — нужно выйти из
# PID 1 (supervisorctl shutdown / kill 1).
[program:browser-watchdog]
command=/usr/local/bin/browser-watchdog.sh
autorestart=true
priority=990
user=root
stdout_logfile=/var/log/neko/browser-watchdog.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
redirect_stderr=true

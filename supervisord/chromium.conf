# §AI-control: штатный запуск Chromium у neko ОТКЛЮЧЁН.
#
# Раньше здесь была программа [program:chromium] (start-chromium.sh) — neko сам
# поднимал браузер. Теперь общий браузер запускает control-plane @playwright/mcp
# (см. browser-mcp.conf): Playwright владеет браузером через pipe-транспорт →
# агент рулит им по MCP (клики/DOM/скриншоты работают, в отличие от внешнего CDP
# по порту, который Chromium 146 глушит с -32001). Пользователь смотрит тот же
# X-экран :99 по WebRTC и вводит ввод как раньше.
#
# Файл намеренно оставлен как chromium.conf, чтобы ПЕРЕОПРЕДЕЛИТЬ апстримовский
# /etc/neko/supervisord/chromium.conf и не дать neko поднять свой Chromium.
# Оставляем только оконный менеджер.

[program:openbox]
environment=HOME="/home/%(ENV_USER)s",USER="%(ENV_USER)s",DISPLAY="%(ENV_DISPLAY)s"
command=/usr/bin/openbox --config-file /etc/neko/openbox.xml
autorestart=true
priority=300
user=%(ENV_USER)s
stdout_logfile=/var/log/neko/openbox.log
stdout_logfile_maxbytes=100MB
stdout_logfile_backups=10
redirect_stderr=true
